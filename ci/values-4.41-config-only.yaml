# Runs SmartFace platform 4.41.0 on helm chart v0.8.24 with values-only changes.
#
# What it does:
# - points every SmartFace platform image at the platform registry
#   (registry.platform-staging.innovatrics.com/vpp/docker, no `sf-` prefix there)
#   and pins tag v5_4.41.0 (the chart's appVersion default is still v5_4.40.1)
# - adds the platform registry pull secret next to the legacy one
#
# What it deliberately does NOT touch:
# - minio stays enabled (4.41 works with any S3-compatible storage; seaweedfs
#   only replaced minio as the *default* in dev/CI environments)
# - rabbitmq subchart stays as-is (4.41 updated the RMQ *client* library only)
# - VectorDB stays disabled (backend default VectorDB__Provider=none)
# - relayController, accessController, station and the tenant management
#   subchart keep their own pinned versions on the legacy registry
#   (global.image.registry must stay on the legacy registry for them)

imagePullSecrets:
  - name: "sf-harbor-registry-creds"
  - name: "sf-gitlab-registry-creds"

api:
  image: &api-image
    registry: "registry.platform-staging.innovatrics.com"
    repository: vpp/docker/api
    tag: "v5_4.41.0"
authApi:
  image: *api-image
dbSynchronizationLeader:
